name: Odoo sync

# Refreshes public/data/live.json every hour and on demand.
# The commit triggers a Vercel redeploy, so the dashboard picks up fresh
# stock/sales numbers automatically. Credentials live in repo Secrets
# (Settings → Secrets and variables → Actions) — never in this file.

on:
  schedule:
    # Two attempts per hour — GitHub's hosted scheduler is best-effort and
    # silently skips runs under load (observed: multi-hour gaps). Firing at
    # :17 and :47 keeps worst-case data age near 30-60 min.
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:            # "Run workflow" button in the Actions tab

permissions:
  contents: write               # needed to push the updated live.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Odoo sync
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python3 scripts/odoo_sync.py

      - name: Build ad brief (Odoo + Meta, compact per-SKU)
        run: python3 scripts/ad_brief.py

      - name: Commit fresh data (if changed)
        run: |
          if git diff --quiet public/data/live.json public/data/ad-brief.json; then
            echo "No data changes — skipping commit"
            exit 0
          fi
          git config user.name "MohanadFalih"
          git config user.email "MohanadFalih@users.noreply.github.com"
          git add public/data/live.json public/data/ad-brief.json
          git commit -m "data: odoo sync $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          git push
