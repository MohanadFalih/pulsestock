name: Probe build (temporary)
on:
  push:
    branches: [claude/resale-probe]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Resale sync (writes public/data/resale.json)
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python3 scripts/resale_sync.py
      - run: pnpm run build
      - name: Screenshot /resale
        run: |
          npx --yes playwright@1.48.2 install --with-deps chromium >/dev/null
          (pnpm exec vite preview --port 4173 >/dev/null 2>&1 &) ; sleep 5
          cat > shot.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1440, height: 1800 } });
            const errs = [];
            p.on('pageerror', e => errs.push(String(e)));
            p.on('console', m => { if (m.type() === 'error') errs.push(m.text()); });
            await p.goto('http://localhost:4173/resale', { waitUntil: 'networkidle' });
            await p.waitForTimeout(2500);
            await p.screenshot({ path: 'resale.png', fullPage: true });
            const m = await b.newPage({ viewport: { width: 390, height: 844 } });
            await m.goto('http://localhost:4173/resale', { waitUntil: 'networkidle' });
            await m.waitForTimeout(2000);
            await m.screenshot({ path: 'resale-mobile.png', fullPage: true });
            console.log('ERRORS', JSON.stringify(errs));
            await b.close();
          })();
          JS
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          node shot.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: |
            resale.png
            resale-mobile.png
            public/data/resale.json
